[package]
name = "perry-ext-iroh"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native bindings for the Iroh P2P framework — direct peer-to-peer QUIC connections with hole punching + relay fallback — for the Perry TypeScript-to-native compiler. Closes PerryTS/perry#425."
repository = "https://github.com/PerryTS/iroh-bindings"
homepage = "https://github.com/PerryTS/iroh-bindings"
readme = "README.md"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Tracks the perry-ffi v0.5 ABI surface published from the
# `PerryTS/perry` workspace. Pinned to a git rev rather than a
# crates.io release until perry-ffi is published on crates.io.
perry-ffi = { git = "https://github.com/PerryTS/perry", branch = "main" }
iroh = "0.98"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
